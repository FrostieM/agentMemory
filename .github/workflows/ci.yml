name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Type check
        run: mypy src
      - name: Modular-file SLOC ceiling
        run: python scripts/check_sloc.py --enforce
      - name: Tests
        run: pytest
      - name: Retrieval evals
        run: python scripts/run_evals.py --workspace default --no-vector
