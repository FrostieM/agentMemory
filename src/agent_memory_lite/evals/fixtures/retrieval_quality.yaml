- name: get_context_preserves_exact_and_semantic_sources
  type: retrieval_context_quality
  setup:
    - episode: "The heap_watchdog v2 fix reduced memory pressure after repeated state refresh cycles."
      label: target
    - episode: "A note about unrelated UI copy and keyboard focus."
  query: "heap watchdog memory pressure state refresh"
  expect_labels: [target]
  expect_sources: [fts]
  expect_sections: [retrieved_chunks]
  expect_substrings:
    - "heap_watchdog v2 fix"
  top_k: 3
  max_tokens: 2500

