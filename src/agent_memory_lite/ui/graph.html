<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>agent-memory-lite — code graph</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
       margin: 0; padding: 0; background: #0d1117; color: #c9d1d9;
       overflow: hidden; }
header { padding: 0.7em 1em; background: #161b22; border-bottom: 1px solid #30363d;
         display: flex; gap: 0.6em; align-items: center; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 1.05em; color: #58a6ff; }
header label { font-size: 0.85em; color: #8b949e; }
header input { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d;
               padding: 0.25em 0.5em; border-radius: 4px; font-size: 0.85em; }
header button { background: #238636; color: white; border: 0; padding: 0.3em 0.7em;
                border-radius: 4px; cursor: pointer; font-size: 0.85em; }
header .status { color: #8b949e; font-size: 0.8em; margin-left: auto; }
header .badge { background: #1f6feb; color: #fff; padding: 0.05em 0.5em;
                border-radius: 10px; font-size: 0.75em; }
header .nav-link { padding: 0.3em 0.7em; border-radius: 4px; color: #8b949e;
                   text-decoration: none; border: 1px solid transparent;
                   text-transform: uppercase; font-size: 0.7em; letter-spacing: 0.05em;
                   font-family: ui-monospace, monospace; }
header .nav-link:hover { color: #c9d1d9; background: #21262d; border-color: #30363d; }
header .nav-link.is-active { color: #58a6ff; background: #21262d; border-color: #30363d; }
header .nav-sep { color: #30363d; margin: 0 0.2em; }
#graph { width: 100vw; height: calc(100vh - 50px); cursor: grab; }
#graph.dragging { cursor: grabbing; }
.legend { position: fixed; bottom: 1em; left: 1em; background: #161b22cc;
          padding: 0.5em 0.7em; border-radius: 6px; font-size: 0.78em;
          border: 1px solid #30363d; }
.legend .row { display: flex; align-items: center; gap: 0.4em; margin: 0.15em 0; }
.legend .swatch { width: 10px; height: 10px; border-radius: 50%; }
#tooltip { position: fixed; pointer-events: none; background: #161b22ee;
           border: 1px solid #30363d; padding: 0.4em 0.6em; border-radius: 4px;
           font-size: 0.78em; max-width: 320px; display: none; z-index: 10; }
.error { color: #f85149; padding: 1em; }
.empty { color: #8b949e; font-style: italic; padding: 1em; }
</style>
</head>
<body>
<header>
  <a class="nav-link" data-nav="ui" href="/ui">Observatory</a>
  <a class="nav-link" data-nav="code" href="/ui/code">Code</a>
  <a class="nav-link is-active" data-nav="graph" href="/ui/graph">Graph</a>
  <span class="nav-sep">|</span>
  <h1>code graph</h1>
  <span class="badge" id="ws-badge">workspace</span>
  <label>workspace_id <input id="ws-input" /></label>
  <label>center <input id="center-input" placeholder="qualified_name (optional)" style="width:18em" /></label>
  <label>depth <input id="depth-input" type="number" min="1" max="5" value="2" style="width:3.5em" /></label>
  <label>max_nodes <input id="max-input" type="number" min="10" max="1000" value="200" style="width:5em" /></label>
  <button id="refresh">refresh</button>
  <span class="status" id="status"></span>
</header>
<svg id="graph"></svg>
<div class="legend" id="legend"></div>
<div id="tooltip"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"
        integrity="sha384-su5kReKyYlIFrI62mbQRKXHzFobMa7BHp1cK6julLPbnYcCW9NIZKJiTODjLPeDh"
        crossorigin="anonymous"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const wsParam = new URLSearchParams(location.search).get("workspace_id") || "default";
  const centerParam = new URLSearchParams(location.search).get("center") || "";
  $("#ws-input").value = wsParam;
  $("#center-input").value = centerParam;
  $("#ws-badge").textContent = wsParam;

  // Sync nav hrefs with the active workspace.
  function syncNav() {
    const ws = $("#ws-input").value;
    document.querySelectorAll(".nav-link[data-nav]").forEach((a) => {
      const base = a.dataset.nav === "ui" ? "/ui"
        : a.dataset.nav === "code" ? "/ui/code"
        : "/ui/graph";
      a.href = ws ? `${base}?workspace_id=${encodeURIComponent(ws)}` : base;
    });
  }
  $("#ws-input").addEventListener("input", syncNav);
  $("#ws-input").addEventListener("change", syncNav);
  syncNav();

  const colorByLang = {
    python: "#3572A5", javascript: "#f1e05a", typescript: "#3178c6",
    go: "#00ADD8", rust: "#dea584", java: "#b07219",
    cpp: "#f34b7d", csharp: "#178600",
  };

  function status(msg, isError = false) {
    $("#status").innerHTML = isError
      ? `<span class="error">${msg}</span>`
      : msg;
  }

  function renderLegend(langs) {
    const used = [...new Set(langs)].filter(Boolean).sort();
    $("#legend").innerHTML = used.map(l =>
      `<div class="row"><span class="swatch" style="background:${colorByLang[l] || '#888'}"></span>${l}</div>`
    ).join("") || "";
  }

  let simulation = null;

  async function load() {
    if (typeof d3 === "undefined") {
      status("D3 not loaded — open this page online once to cache the CDN script", true);
      return;
    }
    const ws = $("#ws-input").value || "default";
    const center = $("#center-input").value.trim();
    const depth = $("#depth-input").value;
    const maxNodes = $("#max-input").value;
    $("#ws-badge").textContent = ws;
    status("loading...");

    const params = new URLSearchParams({
      workspace_id: ws, depth, max_nodes: maxNodes,
    });
    if (center) params.set("center", center);

    let data;
    try {
      const r = await fetch(`/memory/code_graph?${params.toString()}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      data = await r.json();
    } catch (e) {
      status(`error: ${e.message}`, true);
      return;
    }

    if (!data.nodes.length) {
      d3.select("#graph").selectAll("*").remove();
      status(`no graph data for workspace '${ws}'`);
      $("#legend").innerHTML = "";
      return;
    }

    renderLegend(data.nodes.map(n => n.language));
    drawGraph(data);
    status(`${data.nodes.length} nodes, ${data.links.length} links${data.truncated ? " (truncated)" : ""}`);
  }

  function drawGraph(data) {
    const svg = d3.select("#graph");
    svg.selectAll("*").remove();
    const w = window.innerWidth, h = window.innerHeight - 50;
    svg.attr("viewBox", [0, 0, w, h]);

    const g = svg.append("g");
    const zoom = d3.zoom().on("zoom", (e) => g.attr("transform", e.transform));
    svg.call(zoom);

    const link = g.append("g").attr("stroke", "#444").attr("stroke-opacity", 0.5)
      .selectAll("line").data(data.links).join("line")
      .attr("stroke-width", d => d.edge_type === "extends" || d.edge_type === "implements" ? 2 : 1)
      .attr("stroke", d => ({
        extends: "#58a6ff", implements: "#79c0ff", calls: "#888",
        imports: "#666", instantiates: "#d29922", decorated_by: "#ff7b72",
      })[d.edge_type] || "#666")
      .attr("stroke-dasharray", d => d.edge_type === "imports" ? "3,3" : null);

    const node = g.append("g").selectAll("circle").data(data.nodes).join("circle")
      .attr("r", d => Math.max(4, Math.min(20, 4 + Math.sqrt(d.degree) * 2)))
      .attr("fill", d => colorByLang[d.language] || "#888")
      .attr("stroke", "#0d1117").attr("stroke-width", 1.5)
      .style("cursor", "pointer");

    const tip = $("#tooltip");
    node.on("mouseenter", (e, d) => {
      tip.innerHTML = `<b>${d.qualified_name}</b><br/>` +
        `${d.symbol_kind || "?"} · ${d.language || "?"}<br/>` +
        `<span style="color:#8b949e">${d.file_path || ""}</span><br/>` +
        `degree: ${d.degree}`;
      tip.style.display = "block";
      tip.style.left = (e.clientX + 10) + "px";
      tip.style.top = (e.clientY + 10) + "px";
    }).on("mouseleave", () => { tip.style.display = "none"; })
      .on("dblclick", (e, d) => {
        $("#center-input").value = d.qualified_name;
        load();
      });

    node.append("title").text(d => d.qualified_name);

    if (simulation) simulation.stop();
    simulation = d3.forceSimulation(data.nodes)
      .force("link", d3.forceLink(data.links).id(d => d.qualified_name).distance(60))
      .force("charge", d3.forceManyBody().strength(-180))
      .force("center", d3.forceCenter(w / 2, h / 2))
      .on("tick", () => {
        link
          .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
        node.attr("cx", d => d.x).attr("cy", d => d.y);
      });

    node.call(d3.drag()
      .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));
  }

  $("#refresh").addEventListener("click", load);
  $("#center-input").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });

  // Wait for D3 to load (CDN async)
  if (typeof d3 !== "undefined") load();
  else window.addEventListener("load", () => setTimeout(load, 100));
})();
</script>
</body>
</html>
