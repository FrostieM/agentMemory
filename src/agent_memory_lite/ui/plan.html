<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-memory-lite — plan</title>
<link rel="stylesheet" href="/ui/styles.css?v=20260519-v3-brain" />
<style>
  /* Phase 6: plan view over plan_steps for one task. Read-only progress +
     status-grouped step list, backed by GET /memory/plan?task_id=. */
  .plan-body { padding: 24px 32px; max-width: 1000px; }
  .plan-controls { display: flex; gap: 0.6em; align-items: center;
                   margin-bottom: 1.2em; flex-wrap: wrap;
                   font-size: 0.9em; color: var(--text-2); }
  .plan-controls input { background: var(--bg-1); color: var(--text-0);
    border: 1px solid var(--line-soft); border-radius: 4px;
    padding: 0.35em 0.55em; font-family: inherit; font-size: 0.9em; min-width: 22em; }
  .plan-controls button { background: #238636; color: white; border: 0;
    padding: 0.4em 0.9em; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
  .plan-progress { margin-bottom: 1.2em; }
  .plan-progress-bar { height: 8px; background: var(--bg-1); border-radius: 5px;
    overflow: hidden; border: 1px solid var(--line-soft); }
  .plan-progress-fill { height: 100%; background: #238636; width: 0; transition: width 0.3s ease; }
  .plan-progress-label { color: var(--text-2); font-size: 0.82em; margin-bottom: 0.4em;
    font-family: ui-monospace, monospace; }
  .plan-step { background: var(--bg-1); border: 1px solid var(--line-soft);
    border-radius: 8px; padding: 0.7em 1em; margin-bottom: 0.5em;
    border-left: 3px solid var(--line-soft); display: flex; gap: 0.8em; align-items: baseline; }
  .plan-step.is-sub { margin-left: 1.6em; }
  .plan-step.st-active { border-left-color: #58a6ff; background: rgba(88,166,255,0.06); }
  .plan-step.st-done { border-left-color: #56d364; }
  .plan-step.st-blocked { border-left-color: #f85149; }
  .plan-step.st-skipped { border-left-color: #6e7681; }
  .plan-step.st-pending { border-left-color: #6e7681; }
  .plan-rank { color: var(--text-2); font-family: ui-monospace, monospace;
    font-size: 0.8em; min-width: 2.6em; }
  .plan-title { color: var(--text-0); font-size: 0.95em; flex: 1; }
  .plan-step.st-done .plan-title { color: var(--text-2); }
  .plan-step.st-skipped .plan-title { color: var(--text-2); text-decoration: line-through; }
  .badge { display: inline-block; padding: 0.05em 0.5em; border-radius: 10px;
    font-size: 0.7em; font-family: ui-monospace, monospace; text-transform: uppercase;
    letter-spacing: 0.05em; }
  .badge.st-active { background: #1f6feb; color: white; }
  .badge.st-done { background: #56d364; color: #0d1117; }
  .badge.st-blocked { background: #f85149; color: white; }
  .badge.st-skipped { background: #6e7681; color: white; }
  .badge.st-pending { background: #30363d; color: var(--text-1); }
  .empty-state { color: var(--text-2); font-style: italic; padding: 2em;
    text-align: center; background: var(--bg-1); border-radius: 8px;
    border: 1px solid var(--line-soft); }
  .err { color: #f85149; }
</style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle cx="12" cy="12" r="2.4" fill="currentColor"></circle>
            <circle cx="4" cy="12" r="1.4" fill="currentColor" opacity="0.7"></circle>
            <circle cx="20" cy="12" r="1.4" fill="currentColor" opacity="0.7"></circle>
            <circle cx="12" cy="4" r="1.4" fill="currentColor" opacity="0.7"></circle>
            <circle cx="12" cy="20" r="1.4" fill="currentColor" opacity="0.7"></circle>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Memory</div>
          <div class="brand-sub">Plan · agent-memory-lite</div>
        </div>
      </div>
      <div class="header-pills">
        <span id="healthChip" class="chip"><span class="chip-dot"></span><span class="chip-label">health</span><span class="chip-value">…</span></span>
        <span id="chunksChip" class="chip"><span class="chip-label">chunks</span><span class="chip-value">0</span></span>
        <span id="vectorsChip" class="chip"><span class="chip-label">vectors</span><span class="chip-value">0</span></span>
        <span id="maintChip" class="chip"><span class="chip-label">maintenance</span><span class="chip-value">0</span></span>
      </div>
      <div class="header-meta">
        <label class="ws-pick">
          <span class="ws-label">workspace</span>
          <select id="workspaceInput" autocomplete="off" class="ws-val"></select>
        </label>
      </div>
    </header>
    <nav class="app-nav" aria-label="UI sections">
      <a class="app-nav-link" data-nav="ui" href="/ui">Observatory</a>
      <a class="app-nav-link" data-nav="recall" href="/ui/recall">Recall</a>
      <a class="app-nav-link" data-nav="reflexes" href="/ui/reflexes">Reflexes</a>
      <a class="app-nav-link" data-nav="metrics" href="/ui/metrics">Metrics</a>
      <a class="app-nav-link" data-nav="review" href="/ui/review">Review</a>
      <a class="app-nav-link" data-nav="queue" href="/ui/queue">Queue</a>
      <a class="app-nav-link" data-nav="browse" href="/ui/browse">Browse</a>
      <a class="app-nav-link is-active" data-nav="plan" href="/ui/plan">Plan</a>
    </nav>

    <main class="plan-body">
      <div class="plan-controls">
        <label>task_id <input id="task-input" type="text" placeholder="e.g. release-readiness-and-next-hardening" /></label>
        <button id="load">load plan</button>
        <span id="status" class="empty"></span>
      </div>
      <div id="plan-progress" class="plan-progress" hidden>
        <div class="plan-progress-label"></div>
        <div class="plan-progress-bar"><div class="plan-progress-fill"></div></div>
      </div>
      <div id="plan-list"></div>
    </main>
  </div>

<script src="/ui/app_header.js"></script>
<script>
const $ = (s) => document.querySelector(s);

function escape(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]
  ));
}

const _ORDER = { active: 0, blocked: 1, pending: 2, done: 3, skipped: 4 };

async function load() {
  const ws = $("#workspaceInput").value;
  const taskId = $("#task-input").value.trim();
  const list = $("#plan-list");
  const progress = $("#plan-progress");
  $("#status").textContent = "";
  progress.hidden = true;
  if (!taskId) {
    list.innerHTML = `<div class="empty-state">enter a task_id to view its plan</div>`;
    return;
  }
  list.innerHTML = `<div class="empty-state"><span class="app-spinner"></span>loading…</div>`;
  try {
    const params = new URLSearchParams({ workspace_id: ws, task_id: taskId });
    const r = await fetch(`/memory/plan?${params.toString()}`, {
      headers: window.AppHeader.dbHeaders(ws),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    const data = await r.json();
    const steps = (data.data || []).slice();
    if (!steps.length) {
      list.innerHTML = `<div class="empty-state">no plan steps for task '${escape(taskId)}'</div>`;
      return;
    }
    renderProgress(steps);
    // Live plan order is by rank; sub-steps render under their rank too.
    steps.sort((a, b) => (a.rank ?? 0) - (b.rank ?? 0));
    list.innerHTML = steps.map(renderStep).join("");
  } catch (e) {
    list.innerHTML = `<div class="empty-state err">load failed: ${escape(e.message)}</div>`;
  }
}

function renderProgress(steps) {
  const total = steps.length;
  const done = steps.filter(s => s.status === "done").length;
  const active = steps.filter(s => s.status === "active").length;
  const blocked = steps.filter(s => s.status === "blocked").length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const progress = $("#plan-progress");
  progress.hidden = false;
  progress.querySelector(".plan-progress-label").textContent =
    `${done}/${total} done · ${pct}% · ${active} active · ${blocked} blocked`;
  progress.querySelector(".plan-progress-fill").style.width = `${pct}%`;
}

function renderStep(s) {
  const status = String(s.status || "pending").toLowerCase();
  const cls = _ORDER[status] !== undefined ? status : "pending";
  const sub = s.parent_step_id ? " is-sub" : "";
  const rank = s.rank != null ? String(s.rank) : "";
  return `
    <div class="plan-step st-${cls}${sub}">
      <span class="plan-rank">${escape(rank)}</span>
      <span class="plan-title">${escape(s.title || "(untitled step)")}</span>
      <span class="badge st-${cls}">${escape(status)}</span>
    </div>`;
}

$("#load").addEventListener("click", load);
$("#task-input").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });

// Pre-fill task_id from ?task_id= so a brief/link can deep-link a plan.
const _qsTask = new URLSearchParams(location.search).get("task_id");
if (_qsTask) $("#task-input").value = _qsTask;

window.AppHeader.init({ active: "plan", onWorkspaceChange: () => { if ($("#task-input").value.trim()) load(); } });
if (_qsTask) load();
</script>
</body>
</html>
