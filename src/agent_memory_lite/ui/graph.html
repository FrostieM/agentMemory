<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-memory-lite — code graph</title>
<link rel="stylesheet" href="/ui/styles.css?v=20260510-app-nav" />
<style>
  /* Phase 2.3: graph viewport fills the remaining flex-column space
     under the shared .app-header + .app-nav strip. The .app wrapper has
     min-height:100vh + display:flex, so flex:1 makes the svg own the
     visible body. */
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; }
  .app { height: 100vh; }
  #graph { flex: 1; width: 100%; min-height: 0; cursor: grab; display: block; }
  #graph.dragging { cursor: grabbing; }
  .graph-controls { padding: 0.6em 32px; background: var(--bg-1);
                    border-bottom: 1px solid var(--line-soft);
                    display: flex; gap: 0.8em; align-items: center; flex-wrap: wrap;
                    font-size: 0.82em; color: var(--text-2); }
  .graph-controls input { background: var(--bg-0); color: var(--text-0);
                          border: 1px solid var(--line-soft); padding: 0.25em 0.4em;
                          border-radius: 4px; font-size: 0.85em; }
  .graph-controls button { background: #238636; color: white; border: 0;
                           padding: 0.3em 0.7em; border-radius: 4px; cursor: pointer;
                           font-size: 0.85em; }
  .graph-controls .status { color: var(--text-2); font-size: 0.78em; }
  .legend { position: fixed; bottom: 1em; left: 1em; background: var(--bg-1);
            padding: 0.5em 0.7em; border-radius: 6px; font-size: 0.78em;
            border: 1px solid var(--line-soft); }
  .legend .row { display: flex; align-items: center; gap: 0.4em; margin: 0.15em 0; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 50%; }
  #tooltip { position: fixed; pointer-events: none; background: var(--bg-1);
             border: 1px solid var(--line-soft); padding: 0.4em 0.6em;
             border-radius: 4px; font-size: 0.78em; max-width: 320px;
             display: none; z-index: 10; }
  .error { color: #f85149; }
</style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle cx="12" cy="12" r="2.4" fill="currentColor"></circle>
            <circle cx="4" cy="12" r="1.4" fill="currentColor" opacity="0.7"></circle>
            <circle cx="20" cy="12" r="1.4" fill="currentColor" opacity="0.7"></circle>
            <circle cx="12" cy="4" r="1.4" fill="currentColor" opacity="0.7"></circle>
            <circle cx="12" cy="20" r="1.4" fill="currentColor" opacity="0.7"></circle>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Memory</div>
          <div class="brand-sub">Code Graph · agent-memory-lite</div>
        </div>
      </div>
      <div class="header-pills">
        <span id="healthChip" class="chip"><span class="chip-dot"></span><span class="chip-label">health</span><span class="chip-value">…</span></span>
        <span id="chunksChip" class="chip"><span class="chip-label">chunks</span><span class="chip-value">0</span></span>
        <span id="vectorsChip" class="chip"><span class="chip-label">vectors</span><span class="chip-value">0</span></span>
        <span id="maintChip" class="chip"><span class="chip-label">maintenance</span><span class="chip-value">0</span></span>
      </div>
      <div class="header-meta">
        <label class="ws-pick">
          <span class="ws-label">workspace</span>
          <select id="workspaceInput" autocomplete="off" class="ws-val"></select>
        </label>
      </div>
    </header>
    <nav class="app-nav" aria-label="UI sections">
      <a class="app-nav-link" data-nav="ui" href="/ui">Observatory</a>
      <a class="app-nav-link" data-nav="code" href="/ui/code">Code</a>
      <a class="app-nav-link is-active" data-nav="graph" href="/ui/graph">Graph</a>
      <a class="app-nav-link" data-nav="review" href="/ui/review">Review</a>
      <a class="app-nav-link" data-nav="browse" href="/ui/browse">Browse</a>
    </nav>

    <div class="graph-controls">
      <label>center <input id="center-input" placeholder="qualified_name (optional)" style="width:18em" /></label>
      <label>depth <input id="depth-input" type="number" min="1" max="5" value="2" style="width:3.5em" /></label>
      <label>max_nodes <input id="max-input" type="number" min="10" max="1000" value="200" style="width:5em" /></label>
      <label title="MinHash signature similarity (≥0.7)"><input id="soft-sim" type="checkbox" /> similar_signature</label>
      <label title="Symbols frequently changed in the same commit"><input id="soft-co" type="checkbox" /> co_changed</label>
      <button id="refresh">refresh</button>
      <span class="status" id="status"></span>
    </div>

    <svg id="graph"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <div id="tooltip"></div>

<script src="/ui/vendor/d3.v7.8.5.min.js"></script>
<script src="/ui/app_header.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const centerParam = new URLSearchParams(location.search).get("center") || "";
  $("#center-input").value = centerParam;

  const colorByLang = {
    python: "#3572A5", javascript: "#f1e05a", typescript: "#3178c6",
    go: "#00ADD8", rust: "#dea584", java: "#b07219",
    cpp: "#f34b7d", csharp: "#178600",
  };

  function status(msg, isError = false) {
    $("#status").innerHTML = isError ? `<span class="error">${msg}</span>` : msg;
  }

  function renderLegend(langs, softKindsPresent) {
    const used = [...new Set(langs)].filter(Boolean).sort();
    const langRows = used.map(l =>
      `<div class="row"><span class="swatch" style="background:${colorByLang[l] || '#888'}"></span>${l}</div>`
    ).join("");
    // Phase 3.4: legend rows for soft edges only when they appear in
    // the rendered graph — keeps the legend compact otherwise.
    const softRows = softKindsPresent.map(k => {
      const color = k === "similar_signature" ? "#bb9af7" : "#7ee787";
      const label = k === "similar_signature" ? "similar (MinHash)" : "co-changed";
      return `<div class="row"><span class="swatch" style="background:${color};border:1px dashed ${color};opacity:0.7"></span>${label}</div>`;
    }).join("");
    $("#legend").innerHTML = langRows + softRows;
  }

  let simulation = null;

  async function load() {
    if (typeof d3 === "undefined") {
      status("D3 not loaded — vendor bundle missing at /ui/vendor/d3.v7.8.5.min.js", true);
      return;
    }
    const ws = $("#workspaceInput").value || "default";
    const center = $("#center-input").value.trim();
    const depth = $("#depth-input").value;
    const maxNodes = $("#max-input").value;
    status("loading...");

    const params = new URLSearchParams({
      workspace_id: ws, depth, max_nodes: maxNodes,
    });
    if (center) params.set("center", center);
    // Phase 3.4 (v2.2): soft-edge toggles. Each ticked checkbox appends
    // its kind to the multi-value soft_edge_kinds query param so the
    // BFS / overview includes those rows alongside hard edges.
    if ($("#soft-sim").checked) params.append("soft_edge_kinds", "similar_signature");
    if ($("#soft-co").checked) params.append("soft_edge_kinds", "co_changed");

    let data;
    try {
      const r = await fetch(`/memory/code_graph?${params.toString()}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      data = await r.json();
    } catch (e) {
      status(`error: ${e.message}`, true);
      return;
    }

    if (!data.nodes.length) {
      d3.select("#graph").selectAll("*").remove();
      status(`no graph data for workspace '${ws}'`);
      $("#legend").innerHTML = "";
      return;
    }

    const softKinds = [...new Set(data.links.filter(l => l.is_soft).map(l => l.edge_type))];
    renderLegend(data.nodes.map(n => n.language), softKinds);
    drawGraph(data);
    status(`${data.nodes.length} nodes, ${data.links.length} links${data.truncated ? " (truncated)" : ""}`);
  }

  function drawGraph(data) {
    const svg = d3.select("#graph");
    svg.selectAll("*").remove();
    // Use the SVG's own client rect so the simulation centers in the
    // visible area; .app + flex makes SVG fill remaining viewport space.
    const node0 = svg.node();
    const r = node0 ? node0.getBoundingClientRect() : null;
    const w = r && r.width ? r.width : window.innerWidth;
    const h = r && r.height ? r.height : window.innerHeight;
    svg.attr("viewBox", [0, 0, w, h]);

    const g = svg.append("g");
    const zoom = d3.zoom().on("zoom", (e) => g.attr("transform", e.transform));
    svg.call(zoom);

    // Phase 3.4 (v2.2): soft edges (similar_signature / co_changed) get
    // distinct color + dashed pattern + opacity scaled by weight, so the
    // hard-edge call graph reads cleanly as the primary structure and
    // soft edges read as overlay.
    const SOFT_COLORS = { similar_signature: "#bb9af7", co_changed: "#7ee787" };
    const link = g.append("g").attr("stroke", "#444").attr("stroke-opacity", 0.5)
      .selectAll("line").data(data.links).join("line")
      .attr("stroke-width", d => {
        if (d.is_soft) return 1.5;
        return d.edge_type === "extends" || d.edge_type === "implements" ? 2 : 1;
      })
      .attr("stroke", d => {
        if (d.is_soft) return SOFT_COLORS[d.edge_type] || "#bb9af7";
        return ({
          extends: "#58a6ff", implements: "#79c0ff", calls: "#888",
          imports: "#666", instantiates: "#d29922", decorated_by: "#ff7b72",
        })[d.edge_type] || "#666";
      })
      .attr("stroke-opacity", d => d.is_soft ? Math.max(0.3, (d.weight || 0.5)) : 0.5)
      .attr("stroke-dasharray", d => {
        if (d.is_soft) return "5,3";
        return d.edge_type === "imports" ? "3,3" : null;
      });

    const node = g.append("g").selectAll("circle").data(data.nodes).join("circle")
      .attr("r", d => Math.max(4, Math.min(20, 4 + Math.sqrt(d.degree) * 2)))
      .attr("fill", d => colorByLang[d.language] || "#888")
      .attr("stroke", "#0d1117").attr("stroke-width", 1.5)
      .style("cursor", "pointer");

    const tip = $("#tooltip");
    node.on("mouseenter", (e, d) => {
      tip.innerHTML = `<b>${d.qualified_name}</b><br/>` +
        `${d.symbol_kind || "?"} · ${d.language || "?"}<br/>` +
        `<span style="color:#8b949e">${d.file_path || ""}</span><br/>` +
        `degree: ${d.degree}`;
      tip.style.display = "block";
      tip.style.left = (e.clientX + 10) + "px";
      tip.style.top = (e.clientY + 10) + "px";
    }).on("mouseleave", () => { tip.style.display = "none"; })
      .on("dblclick", (e, d) => {
        $("#center-input").value = d.qualified_name;
        load();
      });

    node.append("title").text(d => d.qualified_name);

    if (simulation) simulation.stop();
    simulation = d3.forceSimulation(data.nodes)
      .force("link", d3.forceLink(data.links).id(d => d.qualified_name).distance(60))
      .force("charge", d3.forceManyBody().strength(-180))
      .force("center", d3.forceCenter(w / 2, h / 2))
      .on("tick", () => {
        link
          .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
        node.attr("cx", d => d.x).attr("cy", d => d.y);
      });

    node.call(d3.drag()
      .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));
  }

  $("#refresh").addEventListener("click", load);
  $("#center-input").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
  $("#soft-sim").addEventListener("change", load);
  $("#soft-co").addEventListener("change", load);

  // Bootstrap via AppHeader (Phase 2.3): populate dropdown + sync nav,
  // then load on initial bootstrap and every workspace change.
  window.AppHeader.init({
    active: "graph",
    onWorkspaceChange: () => {
      if (typeof d3 !== "undefined") load();
      else window.addEventListener("load", () => setTimeout(load, 100));
    },
  });
})();
</script>
</body>
</html>
